<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* interface-escura-3d · 9:16 · 1080×1920 · 30 fps.
   Fundo: o próprio conteúdo desfocado + grade de pontos. Uma janela de app escura em perspectiva com o conteúdo rodando dentro,
   uma lista de atos que ganham ✓ verde-menta, barra de progresso e notificação final. Câmera: inclinada de longe → de frente → gira para o lado. */
:root { --bg: #0d0e11; --win: #16171c; --win2: #1b1c22; --line: #26282e; --skel: #2e3036; --skel2: #4a4d54; --text: #eaeaee; --dim: #8a8d96;
  --mint: #3cd48c; --mint-ink: #07150e; --font: "Inter", system-ui, -apple-system, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); }
#stage { position: absolute; inset: 0; perspective: 2200px; perspective-origin: 50% 50%; background: var(--bg); overflow: hidden; }
#bgv { position: absolute; left: 50%; top: 50%; width: 3600px; height: 2025px; margin: -1012px 0 0 -1800px; object-fit: cover;
  filter: blur(30px) brightness(.68) saturate(1.3); transform: translate(var(--px, 0px), var(--py, 0px)) scale(1.08); }
.shade { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 55% at 50% 50%, rgba(13,14,17,.05), rgba(13,14,17,.6) 100%); }
.dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.07) 1.5px, transparent 1.7px); background-size: 34px 34px; }
.wave { position: absolute; inset: 0; background-image: radial-gradient(rgba(60,212,140,.95) 2px, transparent 2.3px); background-size: 34px 34px; opacity: 0;
  -webkit-mask-image: radial-gradient(circle at 50% 52%, transparent calc(var(--r, 0px) - 160px), #000 calc(var(--r, 0px) - 40px), transparent var(--r, 0px));
  mask-image: radial-gradient(circle at 50% 52%, transparent calc(var(--r, 0px) - 160px), #000 calc(var(--r, 0px) - 40px), transparent var(--r, 0px)); }
#cam { position: absolute; left: 50%; top: 975px; width: 940px; height: 1132px; margin: -566px 0 0 -470px; transform-style: preserve-3d; }
.win { position: absolute; inset: 0; border-radius: 22px; background: var(--win); border: 1.5px solid var(--line); box-shadow: 0 50px 120px rgba(0,0,0,.65), 0 10px 30px rgba(0,0,0,.4); overflow: hidden; }
.bar { height: 54px; display: flex; align-items: center; gap: 10px; padding: 0 22px; border-bottom: 1.5px solid var(--line); background: var(--win2); }
.bar i { width: 13px; height: 13px; border-radius: 50%; background: var(--skel); }
.bar .url { margin: 0 auto; width: 300px; height: 22px; border-radius: 11px; background: var(--skel); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 30px 36px 0; }
.top h2 { margin: 0; font: 600 38px/1.1 var(--font); letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { flex: none; font: 600 26px/1 var(--font); color: var(--mint-ink); background: var(--mint); padding: 16px 30px; border-radius: 12px; }
.prog { margin: 22px 36px 0; height: 4px; border-radius: 2px; background: var(--line); }
.prog b { display: block; height: 100%; width: 0; border-radius: 2px; background: var(--mint); }
.view { margin: 26px 36px 0; height: 487px; border-radius: 14px; overflow: hidden; background: #000; border: 1.5px solid var(--line); position: relative; }
.view img { width: 100%; height: 100%; object-fit: var(--fit, cover); display: block; transform: scale(var(--zoom, 1)); transform-origin: 50% 50%; }
.list { margin: 18px 36px 0; }
.row { display: grid; grid-template-columns: 34px 92px 1fr 120px; align-items: center; gap: 22px; height: 76px; border-bottom: 1.5px solid var(--line); }
.row:last-child { border-bottom: 0; }
.ck { width: 30px; height: 30px; border-radius: 8px; border: 2px solid var(--skel2); display: grid; place-items: center; }
.ck svg { width: 20px; height: 20px; opacity: 0; transform: scale(.4); }
.row.done .ck { background: var(--mint); border-color: var(--mint); }
.row.done .ck svg { opacity: 1; transform: scale(var(--pop, 1)); }
.row.now .ck { border-color: var(--mint); box-shadow: 0 0 0 4px rgba(60,212,140,.18); }
.th { width: 92px; height: 58px; border-radius: 10px; background: var(--skel); display: grid; place-items: center; overflow: hidden; }
.th img { max-height: 54px; max-width: 86px; }
.nm { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.nm b { font: 500 28px/1 var(--font); color: var(--text); letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row:not(.done):not(.now) .nm b { color: var(--dim); }
.nm i { display: block; height: 10px; border-radius: 5px; background: var(--skel); }
.pill { justify-self: end; width: 96px; height: 30px; border-radius: 15px; border: 2px solid var(--skel); }
.row.now .pill { border-color: rgba(60,212,140,.5); }
#cursor { position: absolute; width: 34px; height: 34px; pointer-events: none; }
#ring { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; border: 2px solid rgba(234,234,238,.6); opacity: 0; }
.toast { position: absolute; right: 30px; bottom: 150px; display: flex; align-items: center; gap: 22px; padding: 24px 34px 24px 24px; border-radius: 18px;
  background: #1f2026; border: 1.5px solid #30323a; box-shadow: 0 30px 70px rgba(0,0,0,.6); opacity: 0; transform: translateZ(80px); max-width: 640px; }
.toast .ok { flex: none; width: 56px; height: 56px; border-radius: 50%; background: var(--mint); display: grid; place-items: center; }
.toast b { font: 600 32px/1.15 var(--font); letter-spacing: -.01em; }
.toast small { display: block; font: 400 24px/1.2 var(--font); color: var(--dim); margin-top: 6px; }
</style></head>
<body><div id="stage">
  <img id="bgv" alt=""><div class="shade"></div><div class="dots"></div><div class="wave" id="wave"></div>
  <div id="cam"><div class="win">
    <div class="bar"><i></i><i></i><i></i><span class="url"></span></div>
    <div class="top"><h2 id="title"></h2><span class="btn" id="btn"></span></div>
    <div class="prog"><b id="prog"></b></div>
    <div class="view"><img id="shot" alt=""></div>
    <div class="list" id="list"></div>
  </div>
  <div class="toast" id="toast"><span class="ok"><svg viewBox="0 0 24 24" width="30" height="30"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#07150e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span><b id="toastT"></b><small id="toastS"></small></span></div>
  <svg id="cursor" viewBox="0 0 24 24"><path d="M4 2l15 10.5-6.6 1.3 3.9 7.2-2.8 1.5-3.9-7.3L4 20z" fill="#fff" stroke="#0d0e11" stroke-width="1.4" stroke-linejoin="round"/></svg><span id="ring"></span>
  </div>
</div>
<script src="config.js"></script>
<script>
// config.js define window.CFG (veja SKILL.md). Cada ato: { name, thumb, start, end, frames: 'frames/ato1', count, fit, zoom: [de, até] }
const C = window.CFG, ACTS = C.acts, FINAL = C.final, END = C.duration, FPS = 30;
const $ = id => document.getElementById(id);
$('title').textContent = C.title; $('btn').textContent = C.button || 'Abrir'; $('toastT').textContent = C.toast.title; $('toastS').textContent = C.toast.subtitle || '';
const ck = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#07150e" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
$('list').innerHTML = ACTS.map(a => `<div class="row"><span class="ck">${ck}</span><span class="th"><img src="${a.thumb}"></span><span class="nm"><b>${a.name}</b><i style="width:${Math.min(380, 180 + a.name.length * 9)}px"></i></span><span class="pill"></span></div>`).join('');
const rows = [...document.querySelectorAll('.row')];
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), mix = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const spring = k => { k = clamp(k); return 1 - Math.exp(-7 * k) * Math.cos(11 * k); };
const POSE = { far: [44, 0, -14, 0, 120, -900], front: [0, 0, 0, 0, 0, 0], lean: [4, -9, 0, 20, 0, -80], side: [6, -22, 2, 90, 60, -220] };
// câmera padrão: chega inclinada, fica de frente, inclina de leve no meio, gira para o lado no fechamento
const mid = ACTS[Math.floor(ACTS.length / 2)];
const KEY = C.camera || [ [0, 'far'], [1.1, 'front'], [mid.start, 'front'], [mid.start + .8, 'lean'], [mid.end, 'lean'], [mid.end + .8, 'front'], [FINAL - .5, 'front'], [FINAL + .5, 'side'], [END, 'side'] ];
function pose(t) { let i = 0; while (i < KEY.length - 2 && t > KEY[i + 1][0]) i++; const [t0, a] = KEY[i], [t1, b] = KEY[i + 1], k = ease((t - t0) / Math.max(.001, t1 - t0)); return POSE[a].map((v, j) => mix(v, POSE[b][j], k)); }
function actAt(t) { return ACTS.find(a => t < a.end) || ACTS[ACTS.length - 1]; }
window.render = t => {
  const [rx, ry, rz, tx, ty, tz] = pose(t);
  $('cam').style.transform = `translate3d(${tx}px, ${ty}px, ${tz}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg)`;
  const a = actAt(t), lt = t - a.start, idx = Math.min(a.count - 1, Math.max(0, Math.floor(lt * FPS)));
  $('shot').src = a.frames + '/' + String(a.still ? 0 : idx).padStart(5, '0') + '.jpg';
  const z = a.zoom || [1, 1]; $('shot').style.setProperty('--zoom', mix(z[0], z[1], clamp(lt / (a.end - a.start))).toFixed(4)); $('shot').style.setProperty('--fit', a.fit || 'cover');
  let done = 0; ACTS.forEach((x, i) => { if (t >= x.start) done = i; });
  const last = ACTS.length - 1;
  rows.forEach((r, i) => { const fin = i < done || (i === last && t >= FINAL), start = i < done ? ACTS[i + 1].start : FINAL;
    r.classList.toggle('done', fin); r.classList.toggle('now', !fin && i === done);
    r.style.setProperty('--pop', fin ? spring((t - start) / .5).toFixed(3) : 0); });
  const finished = rows.filter(r => r.classList.contains('done')).length;
  $('prog').style.width = (finished / ACTS.length * 100 + (finished < ACTS.length ? 4 : 0)) + '%';
  $('bgv').src = $('shot').src; $('bgv').style.setProperty('--px', (-ry * 7 - tx * .25).toFixed(1) + 'px'); $('bgv').style.setProperty('--py', (rx * 5 - ty * .2).toFixed(1) + 'px');
  const hits = [...ACTS.slice(1).map(x => x.start), FINAL].filter(h => t >= h), h = hits.length ? hits[hits.length - 1] : -9, wk = (t - h) / 1.6;
  $('wave').style.opacity = wk >= 0 && wk < 1 && h > 0 ? (1 - wk * wk).toFixed(3) : 0; $('wave').style.setProperty('--r', (ease(clamp(wk)) * 1500 + 420).toFixed(0) + 'px');
  const btn = $('btn').getBoundingClientRect(), cx = btn.left + btn.width * .62, cy = btn.top + btn.height * .55;
  const ck1 = ease((t - 0.05) / .55), out = ease((t - 1.0) / .5);
  $('cursor').style.left = mix(mix(cx + 260, cx, ck1), cx + 340, out) + 'px'; $('cursor').style.top = mix(mix(cy + 380, cy, ck1), cy + 500, out) + 'px';
  $('cursor').style.opacity = t < 1.5 ? 1 : 0;
  $('btn').style.transform = t > 0.62 && t < 0.82 ? 'scale(.94)' : '';
  const rk = clamp((t - 0.64) / .45); $('ring').style.left = cx + 'px'; $('ring').style.top = cy + 'px'; $('ring').style.opacity = t > 0.64 && rk < 1 ? (1 - rk).toFixed(2) : 0; $('ring').style.transform = `scale(${.4 + rk})`;
  const tk = spring((t - (FINAL + .08)) / .5); $('toast').style.opacity = clamp((t - (FINAL + .08)) / .2); $('toast').style.transform = `translateZ(80px) translateY(${((1 - tk) * 60).toFixed(1)}px)`;
};
render(+(new URLSearchParams(location.search).get('t') || 0));
</script></body></html>
